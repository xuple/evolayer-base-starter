name: linter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Ensure composer.lock is not committed
        run: |
          if [ -f composer.lock ]; then
            echo "::error file=composer.lock::composer.lock must not be committed (see CONTRIBUTING.md → Ground Rules and RELEASE.md). Each create-project install resolves the package fresh; a committed lock pins the package to a machine-local source."
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm ci

      - name: Audit dependencies
        run: |
          composer audit
          npm audit --audit-level=high

      - name: Prepare generated frontend contracts
        # ESLint resolves imports from gitignored Wayfinder/ontology outputs.
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --seed --force
          php artisan wayfinder:generate --with-form --no-interaction
          php artisan evolayer:ontology:compile --no-erd --no-interaction

      - name: Run Pint
        run: composer lint:check

      - name: Check Frontend Formatting
        run: npm run format:check

      - name: Lint Frontend
        run: npm run lint:check
