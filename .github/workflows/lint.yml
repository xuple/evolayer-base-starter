name: linter

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Ensure composer.lock is not committed
        run: |
          if [ -f composer.lock ]; then
            echo "::error file=composer.lock::composer.lock must not be committed (see CONTRIBUTING.md → Ground Rules and RELEASE.md). Each create-project install resolves the package fresh; a committed lock pins the package to a machine-local source."
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Configure private EvoLayer package source
        env:
          EVOLAYER_BASE_GITHUB_TOKEN: ${{ secrets.EVOLAYER_BASE_GITHUB_TOKEN }}
        run: |
          if [ -z "$EVOLAYER_BASE_GITHUB_TOKEN" ]; then
            echo "::error::Set the EVOLAYER_BASE_GITHUB_TOKEN secret with read access to xuple/evolayer-base while the package is private."
            exit 1
          fi

          composer config repositories.0 vcs https://github.com/xuple/evolayer-base.git
          composer config --global github-oauth.github.com "$EVOLAYER_BASE_GITHUB_TOKEN"

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm ci

      - name: Run Pint
        run: composer lint:check

      - name: Check Frontend Formatting
        run: npm run format:check

      - name: Lint Frontend
        run: npm run lint:check
