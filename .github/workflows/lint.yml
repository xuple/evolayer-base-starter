name: linter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Ensure composer.lock is committed and shippable
        run: |
          if [ ! -f composer.lock ]; then
            echo "::error file=composer.lock::composer.lock must be committed (framework-distribution contract — see PROMISE.md / RELEASE.md)."
            exit 1
          fi
          if git check-ignore -q composer.lock; then
            echo "::error file=.gitignore::composer.lock is gitignored but must be tracked."
            exit 1
          fi
          if git check-attr export-ignore -- composer.lock | grep -q 'export-ignore: set'; then
            echo "::error file=.gitattributes::composer.lock must not be export-ignored — it would be stripped from the dist and create-project would re-resolve."
            exit 1
          fi

      - name: Ensure AGENTS.md and CLAUDE.md are byte-identical
        # The two agent guides are a mirror by contract; enforce it instead of
        # trusting prose. If this fails, sync them (they must match exactly).
        run: |
          if ! cmp -s AGENTS.md CLAUDE.md; then
            echo "::error file=CLAUDE.md::AGENTS.md and CLAUDE.md must be byte-identical mirrors."
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm ci

      - name: Audit dependencies
        run: |
          composer audit
          npm run audit:production
          npm run audit:full

      - name: Prepare generated frontend contracts
        # ESLint resolves imports from gitignored Wayfinder/ontology outputs.
        # Clear route caches before Wayfinder so generated routes reflect this
        # checkout instead of a stale cached route table.
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --seed --force
          php artisan route:clear
          php artisan wayfinder:generate --with-form --no-interaction
          php artisan evolayer:ontology:compile --no-erd --no-interaction

      - name: Run Pint
        run: composer lint:check

      - name: Check Frontend Formatting
        run: npm run format:check

      - name: Lint Frontend
        run: npm run lint:check
