name: framework-bump

# Checks for a new xuple/evolayer-base 0.x release on Packagist and opens a
# draft bump PR when one is found.
#
# No-op guarantee: when the current exact pin already equals the latest
# Packagist 0.x version the job exits 0 before any PHP/Node setup or
# PR-creation step. BUMP_PAT is never referenced on a no-op run, so the
# workflow is safe to merge before the secret is provisioned.
#
# BUMP_PAT (required for PR creation only):
#   GITHUB_TOKEN cannot trigger CI on a PR it opens (GitHub limitation).
#   When a bump is actually needed, the final step uses secrets.BUMP_PAT —
#   a Personal Access Token with contents:write + pull-requests:write scoped
#   to this repo. Provision it in GitHub repo Settings → Secrets → Actions
#   before the first real bump is expected.

on:
  schedule:
    - cron: '0 7 * * 1'   # Weekly — Monday 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write        # push the bump branch
  pull-requests: write   # open the draft PR

jobs:
  bump:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect latest 0.x on Packagist
        id: detect
        run: |
          # Use the Packagist p2 API — no PHP environment needed; array is newest-first.
          # Endpoint: https://repo.packagist.org/p2/<vendor>/<package>.json
          RESPONSE=$(curl -sSf 'https://repo.packagist.org/p2/xuple/evolayer-base.json')

          # Extract versions, strip any leading 'v', filter to 0.x only, sort and take newest.
          LATEST=$(echo "$RESPONSE" \
            | jq -r '.packages["xuple/evolayer-base"][].version' \
            | sed 's/^v//' \
            | grep '^0\.' \
            | sort -V \
            | tail -1)

          if [[ -z "$LATEST" ]]; then
            echo "::error::No 0.x version found on Packagist for xuple/evolayer-base."
            exit 1
          fi

          # Current exact pin in composer.json (stored without a v-prefix).
          CURRENT=$(jq -r '.require["xuple/evolayer-base"]' composer.json)

          echo "Packagist latest 0.x : $LATEST"
          echo "Current pin          : $CURRENT"

          if [[ "$CURRENT" == "$LATEST" ]]; then
            echo "Already at $CURRENT — no bump needed."
            echo "needs_bump=false" >> "$GITHUB_OUTPUT"
          else
            echo "Bump available: $CURRENT → $LATEST"
            echo "needs_bump=true"  >> "$GITHUB_OUTPUT"
            echo "latest=$LATEST"   >> "$GITHUB_OUTPUT"
            echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          fi

      # ── Everything below runs only when a newer 0.x release is available ────
      # ── No-op runs (needs_bump=false) skip all remaining steps cleanly. ──────

      - name: Setup PHP
        if: steps.detect.outputs.needs_bump == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        if: steps.detect.outputs.needs_bump == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Rewrite exact constraint in composer.json
        if: steps.detect.outputs.needs_bump == 'true'
        # IMPORTANT: composer update alone does NOT move an exact pin ("0.1.4").
        # The constraint string must be rewritten first, then composer update
        # refreshes composer.lock against the new constraint.
        run: |
          LATEST="${{ steps.detect.outputs.latest }}"
          jq --arg v "$LATEST" \
            '.require["xuple/evolayer-base"] = $v' \
            composer.json > composer.json.tmp
          mv composer.json.tmp composer.json
          echo "composer.json now pins: $(jq -r '.require["xuple/evolayer-base"]' composer.json)"

      - name: Refresh composer.lock
        if: steps.detect.outputs.needs_bump == 'true'
        run: |
          composer update xuple/evolayer-base --with-dependencies \
            --no-interaction --prefer-dist --optimize-autoloader --no-scripts

      - name: Validate Composer metadata
        if: steps.detect.outputs.needs_bump == 'true'
        run: composer validate --strict

      - name: Audit PHP dependencies
        if: steps.detect.outputs.needs_bump == 'true'
        run: composer audit

      - name: Install Node dependencies
        if: steps.detect.outputs.needs_bump == 'true'
        run: npm ci

      - name: Audit Node dependencies
        if: steps.detect.outputs.needs_bump == 'true'
        run: npm audit --audit-level=high

      - name: Prepare Laravel app
        if: steps.detect.outputs.needs_bump == 'true'
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --seed --force
          php artisan route:clear
          php artisan wayfinder:generate --with-form --no-interaction
          php artisan evolayer:ontology:compile --no-erd --no-interaction

      - name: Type-check frontend
        if: steps.detect.outputs.needs_bump == 'true'
        run: npm run types:check

      - name: Build assets
        if: steps.detect.outputs.needs_bump == 'true'
        run: npm run build

      - name: Run health check (strict)
        if: steps.detect.outputs.needs_bump == 'true'
        run: php artisan evolayer:doctor --strict --no-ansi

      - name: Run tests
        if: steps.detect.outputs.needs_bump == 'true'
        run: composer test

      - name: Lint PHP
        if: steps.detect.outputs.needs_bump == 'true'
        run: composer lint:check

      - name: Lint frontend
        if: steps.detect.outputs.needs_bump == 'true'
        run: npm run lint:check

      - name: Check frontend formatting
        if: steps.detect.outputs.needs_bump == 'true'
        run: npm run format:check

      - name: Open draft bump PR
        # Requires secrets.BUMP_PAT — see header comment above.
        # This step is only reached when a real bump is needed; no-op runs
        # never reference this secret.
        if: steps.detect.outputs.needs_bump == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.BUMP_PAT }}
          branch: framework-bump/${{ steps.detect.outputs.latest }}
          commit-message: "chore: bump xuple/evolayer-base ${{ steps.detect.outputs.current }} → ${{ steps.detect.outputs.latest }}"
          title: "chore: bump xuple/evolayer-base ${{ steps.detect.outputs.current }} → ${{ steps.detect.outputs.latest }}"
          body: |
            Automated bump of `xuple/evolayer-base` from `${{ steps.detect.outputs.current }}` to `${{ steps.detect.outputs.latest }}`.

            ## Verification

            All gates passed before this PR was opened:

            - `composer validate --strict` ✅
            - `composer audit` ✅
            - `npm ci` + `npm audit --audit-level=high` ✅
            - `npm run types:check` ✅
            - `npm run build` ✅
            - `php artisan evolayer:doctor --strict --no-ansi` ✅
            - `composer test` ✅
            - `composer lint:check` ✅
            - `npm run lint:check` ✅
            - `npm run format:check` ✅

            ## Review checklist

            - [ ] `composer.json` exact pin updated correctly
            - [ ] `composer.lock` refreshed (review the lock diff)
            - [ ] No unintended dependency changes
            - [ ] All CI checks green on this PR

            > **Do not auto-merge.** Review the lock diff and promote this PR manually.
          draft: true
          delete-branch: false
