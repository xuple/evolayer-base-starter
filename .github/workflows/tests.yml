name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Ensure composer.lock is committed and shippable
        # The template ships a tested, reproducible distribution: create-project
        # installs the locked graph (verified — Composer honors a committed lock,
        # see docs/migration/create-project-lock-behavior.md). The lock must be
        # tracked AND reach the Packagist dist, so it must not be export-ignored.
        run: |
          if [ ! -f composer.lock ]; then
            echo "::error file=composer.lock::composer.lock must be committed (framework-distribution contract — see PROMISE.md / RELEASE.md)."
            exit 1
          fi
          if git check-ignore -q composer.lock; then
            echo "::error file=.gitignore::composer.lock is gitignored but must be tracked."
            exit 1
          fi
          if git check-attr export-ignore -- composer.lock | grep -q 'export-ignore: set'; then
            echo "::error file=.gitattributes::composer.lock must not be export-ignored — it would be stripped from the dist and create-project would re-resolve."
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Copy environment file
        run: cp .env.example .env

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Audit PHP dependencies
        run: composer audit

      - name: Install Node dependencies
        run: npm ci

      - name: Audit Node dependencies
        run: |
          npm run audit:production
          npm run audit:full

      - name: Generate application key
        run: php artisan key:generate

      - name: Prepare Laravel app
        # resources/js/{actions,routes,wayfinder} and resources/js/types/ontology.ts
        # are gitignored; tsc imports `@/routes`, `@/actions/...`, etc. so they
        # must exist before type-check or build. SQLite migration also needs the
        # database file to exist (post-create-project-cmd does this for end users;
        # CI does it here). route:clear prevents stale cached routes from causing
        # incomplete Wayfinder output. evolayer:ontology:compile emits the TS
        # ontology types.
        run: |
          touch database/database.sqlite
          php artisan migrate --seed --force
          php artisan route:clear
          php artisan wayfinder:generate --with-form --no-interaction
          php artisan evolayer:ontology:compile --no-erd --no-interaction

      - name: Type-check frontend
        run: npm run types:check

      - name: Build assets
        run: npm run build

      - name: Run health check (strict)
        # Doctor stays informational by default (advisories often depend
        # on which host-side features are enabled). This starter ships
        # kitchen-sink posture, so any advisory is a regression — opt into
        # the package's --strict exit-code contract (xuple/evolayer-base
        # f02e60f+).
        run: php artisan evolayer:doctor --strict --no-ansi

      - name: Run tests
        run: composer test
