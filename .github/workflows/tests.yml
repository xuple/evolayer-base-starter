name: tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Ensure composer.lock is not committed
        run: |
          if [ -f composer.lock ]; then
            echo "::error file=composer.lock::composer.lock must not be committed (see CONTRIBUTING.md → Ground Rules and RELEASE.md). Each create-project install resolves the package fresh; a committed lock pins the package to a machine-local source."
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Configure private EvoLayer package source
        env:
          EVOLAYER_BASE_GITHUB_TOKEN: ${{ secrets.EVOLAYER_BASE_GITHUB_TOKEN }}
        run: |
          if [ -z "$EVOLAYER_BASE_GITHUB_TOKEN" ]; then
            echo "::error::Set the EVOLAYER_BASE_GITHUB_TOKEN secret with read access to xuple/evolayer-base while the package is private."
            exit 1
          fi

          composer config repositories.0 vcs https://github.com/xuple/evolayer-base.git
          composer config --global github-oauth.github.com "$EVOLAYER_BASE_GITHUB_TOKEN"

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Prepare Laravel app
        # resources/js/{actions,routes,wayfinder} and resources/js/types/ontology.ts
        # are gitignored; tsc imports `@/routes`, `@/actions/...`, etc. so they
        # must exist before type-check or build. SQLite migration also needs the
        # database file to exist (post-create-project-cmd does this for end users;
        # CI does it here). evolayer:ontology:compile emits the TS ontology types.
        run: |
          touch database/database.sqlite
          php artisan migrate --seed --force
          php artisan wayfinder:generate --with-form --no-interaction
          php artisan evolayer:ontology:compile --no-erd --no-interaction

      - name: Type-check frontend
        run: npm run types:check

      - name: Build assets
        run: npm run build

      - name: Run health check (strict)
        # Doctor stays informational by default (advisories often depend
        # on which host-side features are enabled). This starter ships
        # kitchen-sink posture, so any advisory is a regression — opt into
        # the package's --strict exit-code contract (xuple/evolayer-base
        # f02e60f+).
        run: php artisan evolayer:doctor --strict --no-ansi

      - name: Run tests
        run: composer test
