name: tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Configure private EvoLayer package source
        env:
          EVOLAYER_BASE_GITHUB_TOKEN: ${{ secrets.EVOLAYER_BASE_GITHUB_TOKEN }}
        run: |
          if [ -z "$EVOLAYER_BASE_GITHUB_TOKEN" ]; then
            echo "::error::Set the EVOLAYER_BASE_GITHUB_TOKEN secret with read access to xuple/evolayer-base while the package is private."
            exit 1
          fi

          composer config repositories.0 vcs https://github.com/xuple/evolayer-base.git
          composer config --global github-oauth.github.com "$EVOLAYER_BASE_GITHUB_TOKEN"

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Type-check frontend
        run: npm run types:check

      - name: Build assets
        run: npm run build

      - name: Run health check
        run: php artisan evolayer:doctor

      - name: Run tests
        run: composer test
